<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مطابقة المرتجعات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#f1f3ef;--card:#fff;--ink:#1a1f28;--muted:#626a76;--line:#d9ddd5;
  --blue:#2742b8;--green:#1c7c45;--green-bg:#dff2e6;--red:#b8322a;--red-bg:#fae3e0;--orange:#9a5f0c;--orange-bg:#f9ecd4;
  --sans:"IBM Plex Sans Arabic",system-ui,Tahoma,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;--bg:#12151b;--card:#1c2029;--ink:#eceef2;--muted:#9ba3af;--line:#2e3440;
  --blue:#8a9ef4;--green:#63d193;--green-bg:#15301f;--red:#f2877e;--red-bg:#3b1d1b;--orange:#e7b75f;--orange-bg:#372912;}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 50px)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:24px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.step{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;margin:0}
.step i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--blue);color:var(--card);display:grid;place-items:center;font-family:var(--mono);font-size:16px;flex:none}
textarea{width:100%;min-height:100px;font:14px var(--mono);direction:ltr;text-align:left;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
.note{margin:0;color:var(--muted);font-size:14px}
.note b{color:var(--ink)}
.big{width:100%;font:700 19px var(--sans);padding:18px;border-radius:12px;border:0;background:var(--blue);color:var(--card);cursor:pointer;display:block;text-align:center}
.small{font:600 15px var(--sans);padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:center;flex:1}
.row{display:flex;gap:8px}
input[type=file]{display:none}
button:focus-visible,label:focus-within,textarea:focus{outline:3px solid var(--blue);outline-offset:2px}
#reader{width:100%;border-radius:10px;overflow:hidden}
#reader video{border-radius:10px}
#flash{border-radius:12px;padding:14px;text-align:center;font-weight:700;font-size:18px;background:var(--bg);color:var(--muted)}
#flash.ok{background:var(--green-bg);color:var(--green)}
#flash.warn{background:var(--orange-bg);color:var(--orange)}
#flash.bad{background:var(--red-bg);color:var(--red)}
#flash .n{display:block;font:500 15px var(--mono);direction:ltr}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.box{border-radius:12px;padding:10px 6px;text-align:center}
.box b{display:block;font:700 28px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.box span{font-size:13px;font-weight:600}
.box.g{background:var(--green-bg);color:var(--green)}
.box.r{background:var(--red-bg);color:var(--red)}
.box.o{background:var(--orange-bg);color:var(--orange)}
h3{margin:0 0 6px;font-size:16px}
h3.r{color:var(--red)}h3.o{color:var(--orange)}h3.g{color:var(--green)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:9px;padding:8px 10px}
.num{flex:1;font:500 15px var(--mono);direction:ltr;text-align:left;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.num b{color:var(--ink)}
li button{font:600 13px var(--sans);border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;padding:5px 10px;cursor:pointer}
li button.on{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.none{color:var(--muted);font-size:14px}
details summary{cursor:pointer;font-weight:700;color:var(--green)}
#confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <h1>مطابقة المرتجعات</h1>

  <div class="card">
    <p class="step"><i>1</i>الصق رسالة الفرع</p>
    <textarea id="paper" placeholder="الصق رسالة الواتساب هنا زي ما هي"></textarea>
    <p class="note" id="paperInfo">لسه مفيش أرقام.</p>
  </div>

  <div class="card">
    <p class="step"><i>2</i>اسكان البوالص اللي وصلت</p>
    <button class="big" id="liveBtn" type="button">افتح الكاميرا</button>
    <div id="reader"></div>
    <div class="row">
      <label class="small">صوّر صورة<input type="file" id="photo" accept="image/*" capture="environment" multiple></label>
      <button class="small" id="typeBtn" type="button">اكتب رقم</button>
    </div>
    <div class="row" id="typeRow" hidden>
      <textarea id="typed" style="min-height:44px" placeholder="JEG000..."></textarea>
      <button class="small" id="addBtn" type="button" style="flex:none">إضافة</button>
    </div>
    <div id="flash">وجّه الكاميرا على باركود البوليصة</div>
  </div>

  <div class="card">
    <p class="step"><i>3</i>النتيجة</p>
    <div class="sum">
      <div class="box g"><b id="nOk">0</b><span>وصل من <em id="nExp" style="font-style:normal">0</em></span></div>
      <div class="box r"><b id="nMiss">0</b><span>ناقص</span></div>
      <div class="box o"><b id="nExtra">0</b><span>زيادة</span></div>
    </div>
    <div><h3 class="r">ناقص: في الكشف ولسه ما وصلش</h3><ul id="lMiss"></ul></div>
    <div><h3 class="o">زيادة: وصل ومش مكتوب في الكشف</h3><ul id="lExtra"></ul></div>
    <details><summary>المطابق (<span id="nOk2">0</span>)</summary><ul id="lOk" style="margin-top:8px"></ul></details>
  </div>

  <div class="card">
    <p class="step"><i>4</i>ابعت التقرير للفرع</p>
    <button class="big" id="copyBtn" type="button">انسخ التقرير</button>
    <textarea id="report" readonly hidden style="font-family:var(--sans);direction:rtl;text-align:right;min-height:180px"></textarea>
    <button class="small" id="resetBtn" type="button" style="color:var(--red)">امسح وابدأ مطابقة جديدة</button>
    <div id="confirm" hidden>
      <span>هيتمسح كل حاجة. متأكد؟</span>
      <button class="small" id="yes" type="button" style="color:var(--red);flex:none">أيوه امسح</button>
      <button class="small" id="no" type="button" style="flex:none">لا</button>
    </div>
  </div>
  <div id="fileReader" hidden></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var KEY='returns-match-v2';
var state={paper:'',scanned:[]};
try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.scanned))state=s}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

function paperIds(){
  var m=(state.paper||'').toUpperCase().match(/JEG\s*\d{9,15}/g)||[];
  var out=[];m.forEach(function(x){x=x.replace(/\s/g,'');if(out.indexOf(x)<0)out.push(x)});return out;
}
function clean(raw){
  var t=String(raw||'').toUpperCase().trim();
  var m=t.match(/JEG\s*\d{9,15}/);if(m)return m[0].replace(/\s/g,'');
  t=t.replace(/\s/g,'');
  if(/^\d{12}$/.test(t))return 'JEG'+t;
  return t.length>=6?t:null;
}
function show(id){return id.length>8?id.slice(0,-6)+'<b>'+id.slice(-6)+'</b>':'<b>'+id+'</b>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

var ac;
function beep(f){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.2;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.15)}catch(e){}}
function say(word,f){
  try{
    if(!window.speechSynthesis)return beep(f);
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=1.1;u.volume=1;
    speechSynthesis.speak(u);
  }catch(e){beep(f)}
}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function flash(cls,msg,id){var f=$('#flash');f.className=cls;f.innerHTML=esc(msg)+(id?'<span class="n">'+esc(id)+'</span>':'')}

function add(raw){
  var id=clean(raw);if(!id)return;
  if(state.scanned.some(function(x){return x.id===id})){flash('','متسجلة قبل كده',id);return}
  state.scanned.push({id:id,bad:false});save();
  if(paperIds().indexOf(id)>=0){flash('ok','YES – مطابقة',id);say('Yes',900);vib(80)}
  else{flash('warn','NO – مش موجودة في الكشف',id);say('No',300);vib([100,80,100])}
  render();
}

function render(){
  var exp=paperIds(),have={};state.scanned.forEach(function(x){have[x.id]=x});
  var ok=exp.filter(function(i){return have[i]}),miss=exp.filter(function(i){return !have[i]});
  var extra=state.scanned.filter(function(x){return exp.indexOf(x.id)<0}).map(function(x){return x.id});
  $('#paperInfo').innerHTML=exp.length?'تم قراءة <b>'+exp.length+'</b> شحنة من الرسالة':'لسه مفيش أرقام.';
  $('#nExp').textContent=exp.length;$('#nOk').textContent=ok.length;$('#nOk2').textContent=ok.length;
  $('#nMiss').textContent=miss.length;$('#nExtra').textContent=extra.length;
  function li(id,btns){
    var x=have[id];
    return '<li><span class="num">'+show(esc(id))+'</span>'+(btns?
      '<button type="button" data-a="bad" data-id="'+esc(id)+'" class="'+(x.bad?'on':'')+'">'+(x.bad?'تالفة':'تالفة؟')+'</button>'+
      '<button type="button" data-a="del" data-id="'+esc(id)+'">شيل</button>':'')+'</li>';
  }
  $('#lMiss').innerHTML=miss.map(function(i){return li(i,false)}).join('')||'<li class="none">مفيش</li>';
  $('#lExtra').innerHTML=extra.map(function(i){return li(i,true)}).join('')||'<li class="none">مفيش</li>';
  $('#lOk').innerHTML=ok.map(function(i){return li(i,true)}).join('')||'<li class="none">مفيش</li>';
  return {exp:exp,ok:ok,miss:miss,extra:extra};
}

document.addEventListener('click',function(e){
  var b=e.target.closest('li button');if(!b)return;var id=b.dataset.id;
  if(b.dataset.a==='del')state.scanned=state.scanned.filter(function(x){return x.id!==id});
  else state.scanned.forEach(function(x){if(x.id===id)x.bad=!x.bad});
  save();render();
});

var paper=$('#paper');paper.value=state.paper;
paper.addEventListener('input',function(){state.paper=paper.value;save();render()});

// live camera
var scanner=null,last={};
$('#liveBtn').addEventListener('click',function(){
  var btn=this;
  if(scanner){scanner.stop().catch(function(){});scanner.clear();scanner=null;btn.textContent='افتح الكاميرا';return}
  if(!window.Html5Qrcode){flash('bad','الأداة محتاجة إنترنت أول مرة عشان الكاميرا تشتغل');return}
  scanner=new Html5Qrcode('reader',{experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
  scanner.start({facingMode:'environment'},{fps:10,qrbox:function(w,h){return {width:Math.floor(w*.85),height:Math.floor(Math.min(h*.5,w*.5))}}},
    function(text){var now=Date.now();if(last[text]&&now-last[text]<3000)return;last[text]=now;add(text)},function(){})
  .then(function(){btn.textContent='اقفل الكاميرا';flash('','وجّه الكاميرا على باركود البوليصة')})
  .catch(function(){scanner=null;flash('bad','الكاميرا ما اشتغلتش. اسمح للمتصفح بالكاميرا، أو استخدم "صوّر صورة"')});
});

// photos
var detector=null;if('BarcodeDetector' in window){try{detector=new BarcodeDetector()}catch(e){}}
function readPhoto(file){
  var tryLib=function(){
    if(!window.Html5Qrcode)return Promise.resolve([]);
    return new Html5Qrcode('fileReader').scanFile(file,false).then(function(t){return [t]}).catch(function(){return []});
  };
  if(!detector)return tryLib();
  return createImageBitmap(file).then(function(b){return detector.detect(b)})
    .then(function(r){return r.length?r.map(function(x){return x.rawValue}):tryLib()}).catch(tryLib);
}
$('#photo').addEventListener('change',function(e){
  var files=[].slice.call(e.target.files);e.target.value='';if(!files.length)return;
  flash('','بيقرا الصورة…');var found=0;
  files.reduce(function(p,f){return p.then(function(){return readPhoto(f).then(function(c){c.forEach(function(t){found++;add(t)})})})},Promise.resolve())
  .then(function(){if(!found)flash('bad','الباركود ما اتقراش. قرّب الموبايل وصوّر تاني')});
});

// typing
$('#typeBtn').addEventListener('click',function(){$('#typeRow').hidden=!$('#typeRow').hidden;if(!$('#typeRow').hidden)$('#typed').focus()});
$('#addBtn').addEventListener('click',function(){var t=$('#typed');var m=t.value.toUpperCase().match(/JEG\s*\d{9,15}/g);(m||[t.value]).forEach(add);t.value=''});

// report
$('#copyBtn').addEventListener('click',function(){
  var r=render(),bad=state.scanned.filter(function(x){return x.bad}).map(function(x){return x.id});
  var d=new Date().toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'});
  var t='مطابقة مرتجعات J&T – '+d+'\n\nالعدد في الكشف: '+r.exp.length+'\nوصل فعلاً: '+r.ok.length+'\n';
  t+='\nناقص (مكتوب في الكشف ولم يصل): '+r.miss.length+(r.miss.length?'\n'+r.miss.map(function(i){return '- '+i}).join('\n'):'')+'\n';
  if(r.extra.length)t+='\nوصل وغير مكتوب في الكشف: '+r.extra.length+'\n'+r.extra.map(function(i){return '- '+i}).join('\n')+'\n';
  if(bad.length)t+='\nوصل تالف أو مفتوح: '+bad.length+'\n'+bad.map(function(i){return '- '+i}).join('\n')+'\n';
  if(r.miss.length)t+='\nالشحنات الناقصة لم يتم استلامها.';
  var ta=$('#report'),btn=this;ta.value=t;ta.hidden=false;
  var manual=function(){ta.focus();ta.select();btn.textContent='حدد النص وانسخه'};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){btn.textContent='اتنسخ ✓ الصقه في الواتساب';setTimeout(function(){btn.textContent='انسخ التقرير'},2500)},manual);
  }else manual();
});
$('#resetBtn').addEventListener('click',function(){$('#confirm').hidden=false});
$('#no').addEventListener('click',function(){$('#confirm').hidden=true});
$('#yes').addEventListener('click',function(){
  state={paper:'',scanned:[]};paper.value='';$('#report').hidden=true;$('#confirm').hidden=true;
  flash('','وجّه الكاميرا على باركود البوليصة');save();render();
});
render();
})();
</script>
</body>
</html>
